<script>
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

window.addEventListener('load', function() {
  window.scrollTo(0, 0);
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;
  document.querySelectorAll('iframe[data-src]').forEach(function(iframe) {
    iframe.src = iframe.getAttribute('data-src');
    iframe.removeAttribute('data-src');
  });
});

if (window.matchMedia('(max-width: 520px)').matches) {
  document.querySelectorAll('iframe').forEach(function(iframe) {
    var w = parseFloat(iframe.getAttribute('width')) || 500;
    var h = parseFloat(iframe.getAttribute('height')) || 281;
    var wrap = document.createElement('div');
    wrap.className = 'video-wrap';
    wrap.style.paddingBottom = (h / w * 100).toFixed(2) + '%';
    iframe.parentNode.insertBefore(wrap, iframe);
    wrap.appendChild(iframe);
    wrap.addEventListener('click', function() { wrap.classList.add('active'); });
  });

  document.querySelectorAll('table').forEach(function(table) {
    var tds = table.querySelectorAll('td');
    if (tds.length < 2) return;
    var img = tds[0].querySelector('img');
    if (!img) return;
    var div = document.createElement('div');
    var imgEl = img.cloneNode(true);
    imgEl.removeAttribute('width');
    imgEl.removeAttribute('height');
    imgEl.style.cssText = 'width:100%;height:auto;display:block;';
    div.appendChild(imgEl);
    var textDiv = document.createElement('div');
    textDiv.innerHTML = tds[1].innerHTML;
    textDiv.setAttribute('style', tds[1].getAttribute('style') || '');
    div.appendChild(textDiv);
    table.parentNode.replaceChild(div, table);
  });
}

</script>
